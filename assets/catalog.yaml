# PantrySort food catalog: QR sku -> static product facts.
# category must be a FoodCategory value (see src/pantrysort/inventory/models.py).
# shelf_life_days is only used when a QR label has no exp date.
# shape names a mesh in assets/items/shapes.yaml (how the item looks in the sim);
# meshes come from scripts/generate_printables.py and the apples 3MF.

