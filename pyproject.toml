[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantrysort"
version = "0.1.0"
description = "Autonomous food pantry sorting with Drake simulation and LeRobot policies."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Hackachusetts Team" }]
keywords = ["robotics", "drake", "lerobot", "manipulation", "food-pantry", "inventory"]

dependencies = [
    # --- Simulation / manipulation ---
    "drake>=1.30.0",            # pydrake: physics sim, planning, grasp/motion
    "manipulation>=2024.0.0",   # MIT 6.4210 companion utilities for pydrake
    # --- Learned policies ---
    "lerobot>=0.3.0",           # Hugging Face LeRobot (policies, datasets)
    # --- Core scientific stack ---
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    # --- Perception / vision ---
    "opencv-python>=4.8",
    "pillow>=10.0",
    # --- Inventory / data ---
    "pydantic>=2.5",
    "python-dateutil>=2.8",
    "sqlalchemy>=2.0",
    # --- Config / CLI ---
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.0",
]

[project.scripts]
pantrysort-sim = "pantrysort.pipeline.sort_loop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
